# .github/dependabot.yml - Automated dependency updates
version: 2
updates:
  # GitHub Actions
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 5
    assignees:
      - "DiogoRibeiro7"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "🔧"
      prefix-development: "🔧"

