# .github/dependabot.yml - Automated dependency updates
version: 2
updates:
  # Update GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 5
    assignees:
      - "DiogoRibeiro7"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "🔧"
      prefix-development: "🔧"

  # Update R package dependencies (if using renv)
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "submodules"
