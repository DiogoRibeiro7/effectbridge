# .github/ISSUE_TEMPLATE/bug_report.yml - Bug report template
name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug", "triage"]
assignees:
  - DiogoRibeiro7

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🙏
        
        Before submitting, please:
        - Search existing issues to avoid duplicates
        - Use the latest version of effectbridge
        - Include a minimal reproducible example

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: code
    id: reprex
    attributes:
      label: Reproducible Example
      description: |
        Provide a minimal reproducible example using the `reprex` package:
        ```r
        reprex::reprex({
          # Your code here
          library(effectbridge)
          # ... minimal example that demonstrates the bug
        })
        ```
      language: r
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include any error messages.
    validations:
      required: true

  - type: textarea
    id: sessioninfo
    attributes:
      label: Session Info
      description: |
        Run `sessionInfo()` or `sessioninfo::session_info()` and paste the output:
      render: text
      placeholder: |
        R version 4.3.0 (2023-04-21)
        Platform: x86_64-pc-linux-gnu (64-bit)
        ...
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues
          required: true
        - label: I am using the latest version of effectbridge
          required: true
        - label: I have included a reproducible example
          required: true
        - label: I have included my session info
          required: true
