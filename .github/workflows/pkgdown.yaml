# .github/workflows/pkgdown.yaml
# Build pkgdown site for this package and publish it into your blog repo at:
#   https://diogoribeiro7.github.io/packages/unconfoundedr/
# Requires a PAT with "repo" scope stored as PERSONAL_ACCESS_TOKEN in *this* repo.

name: pkgdown

on:
  push:
    branches: [main, develop]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    concurrency:
      group: pkgdown-${{ github.ref }}
      cancel-in-progress: true

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BLOG_REPO: DiogoRibeiro7/DiogoRibeiro7.github.io
      BLOG_DEST: packages/unconfoundedr   # change if you want a different mount point

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies (roxygen2 + pkgdown + local package)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::roxygen2
            any::pkgdown
            local::.
          needs: website

      - name: Document (generate NAMESPACE & man/)
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Build pkgdown site into docs/
        run: pkgdown::build_site(preview = FALSE)
        shell: Rscript {0}

      - name: Checkout blog repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BLOG_REPO }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # PAT with repo write access to the blog repo
          path: blog-repo

      - name: Copy package docs to blog (includes dotfiles, cleans removed files)
        run: |
          mkdir -p "blog-repo/${BLOG_DEST}"
          rsync -av --delete docs/ "blog-repo/${BLOG_DEST}/"
          # show a short listing for debugging
          ls -la "blog-repo/${BLOG_DEST}" | sed -n '1,80p'

      # If you manage /packages/index.md and navigation.yml manually, you don't need auto-edit steps.

      - name: Commit and push changes to blog
        run: |
          cd blog-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update unconfoundedr pkgdown documentation"
            git push
          fi
