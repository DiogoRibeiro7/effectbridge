# .github/workflows/pkgdown.yaml
# Build pkgdown site for this package and publish it into your blog repo at:
#   https://diogoribeiro7.github.io/packages/effectbridge/
# Requires a PAT with "repo" scope stored as PERSONAL_ACCESS_TOKEN in *this* repo.

name: pkgdown

on:
  push:
    branches: [main, develop]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    concurrency:
      group: pkgdown-${{ github.ref }}
      cancel-in-progress: true

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BLOG_REPO: DiogoRibeiro7/DiogoRibeiro7.github.io
      BLOG_DEST: packages/effectbridge

    steps:
      - name: Checkout package repository
        uses: actions/checkout@v6

      # Ensure a known-good Pandoc is on PATH
      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.3'  # or '3.1.11'

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install rmarkdown too (needed for vignettes/articles & pkgdown rendering)
      - name: Install dependencies (roxygen2 + pkgdown + rmarkdown + local package)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::roxygen2
            any::pkgdown
            any::rmarkdown
          needs: website

      # Quick sanity check to fail fast if Pandoc isn't visible to rmarkdown
      - name: Verify Pandoc is available
        shell: Rscript {0}
        run: |
          cat("pandoc on PATH:", Sys.which("pandoc"), "\n")
          print(rmarkdown::find_pandoc())
          rmarkdown::pandoc_available(error = TRUE)

      - name: Document (generate NAMESPACE & man/)
        shell: Rscript {0}
        run: roxygen2::roxygenise()

      - name: Build pkgdown site into docs/
        shell: Rscript {0}
        run: pkgdown::build_site(preview = FALSE)

      - name: Checkout blog repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BLOG_REPO }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}  # PAT with repo write access to the blog repo
          path: blog-repo

      - name: Copy package docs to blog (includes dotfiles, cleans removed files)
        run: |
          mkdir -p "blog-repo/${BLOG_DEST}"
          rsync -av --delete docs/ "blog-repo/${BLOG_DEST}/"
          # show a short listing for debugging
          ls -la "blog-repo/${BLOG_DEST}" | sed -n '1,80p'

      - name: Commit and push changes to blog
        run: |
          cd blog-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update effectbridge pkgdown documentation"
            git push
          fi
