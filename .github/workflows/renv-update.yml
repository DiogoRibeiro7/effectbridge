name: Bootstrap or Restore renv

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  renv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Let create-pull-request manage its own credentials
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install renv
        run: Rscript -e 'install.packages("renv", repos="https://cloud.r-project.org")'

      - name: Bootstrap or restore
        id: renv
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "renv.lock" ]; then
            echo "No renv.lock found — bootstrapping…"
            Rscript -e 'renv::init(bare = TRUE); renv::snapshot(prompt = FALSE)'
            # keep renv out of package tarballs
            rb=".Rbuildignore"
            add_line () {
              local pat="$1"
              if [ ! -f "$rb" ] || ! grep -Pq "$pat" "$rb"; then
                printf "%s\n" "$pat" >> "$rb"
              fi
            }
            add_line '^renv($|/)'
            add_line '^renv\.lock$'
            add_line '^\..Rprofile$'
            echo "BOOTSTRAPPED=1" >> "$GITHUB_OUTPUT"
          else
            echo "renv.lock found — restoring…"
            Rscript -e 'renv::restore(prompt = FALSE)'
            echo "BOOTSTRAPPED=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR with initial lockfile
        if: steps.renv.outputs.BOOTSTRAPPED == '1'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(renv): initialize renv and add lockfile"
          title: "chore(renv): bootstrap renv"
          body: "Initial `renv` setup: adds `.Rprofile`, `renv/activate.R`, and `renv.lock`."
          branch: "chore/renv-bootstrap"
          labels: |
            dependencies
            R
          reviewers: |
            diogoribeiro7
          signoff: false
          # Uses the workflow GITHUB_TOKEN automatically; no PAT needed

