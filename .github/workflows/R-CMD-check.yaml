# Enhanced R-CMD-check workflow with comprehensive testing
name: R-CMD-check

on:
  push:
    branches: [main, develop, release/*]
    paths-ignore:
      - 'README.md'
      - 'NEWS.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'README.md'
      - 'NEWS.md'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    # Run daily at 2 AM UTC to catch upstream dependency issues
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      run_extended_tests:
        description: 'Run extended test suite (longer runtime)'
        required: false
        default: false
        type: boolean

# Cancel concurrent workflows
concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick syntax and basic checks
  lint-and-style:
    name: Lint and Style Check
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install styler and lintr
        run: |
          install.packages(c("styler", "lintr", "devtools"))
        shell: Rscript {0}

      - name: Check code style
        run: |
          issues <- styler::style_pkg(dry = "on")
          if (length(issues) > 0) {
            cat("Style issues found:\n")
            print(issues)
            quit(status = 1)
          }
        shell: Rscript {0}

      - name: Lint code
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints) > 0) {
            quit(status = 1)
          }
        shell: Rscript {0}

  # Core R CMD check across multiple environments
  check:
    name: R-CMD-check (${{ matrix.config.os }}, R-${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    
    strategy:
      fail-fast: false
      matrix:
        config:
          # Standard CRAN checks
          - {os: macos-latest,   r: 'release', artifact-name: 'macOS'}
          - {os: windows-latest, r: 'release', artifact-name: 'Windows'}
          - {os: ubuntu-latest,  r: 'devel',   artifact-name: 'Linux-devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release', artifact-name: 'Linux-release'}
          - {os: ubuntu-latest,  r: 'oldrel-1', artifact-name: 'Linux-oldrel'}
          # Additional environments
          - {os: ubuntu-latest,  r: '4.1.0', artifact-name: 'Linux-minimal'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_: false
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
      _R_CHECK_FORCE_SUGGESTS_: false  # Allow missing Suggests packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          brew install harfbuzz fribidi

      - name: Query R dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
          writeLines(sprintf("R-%i.%i", getRversion()$major, getRversion()$minor), ".github/R-version")
        shell: Rscript {0}

      - name: Cache R packages
        if: runner.os != 'Windows'
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-

      - name: Install core dependencies
        run: |
          remotes::install_deps(dependencies = TRUE, upgrade = "never")
          remotes::install_cran("rcmdcheck")
        shell: Rscript {0}

      - name: Install optional dependencies (if available)
        continue-on-error: true
        run: |
          # Try to install optional packages
          optional_packages <- c("tmle", "MatchIt", "energy", "covr")
          for (pkg in optional_packages) {
            tryCatch({
              install.packages(pkg)
              cat("✓ Installed", pkg, "\n")
            }, error = function(e) {
              cat("✗ Failed to install", pkg, ":", e$message, "\n")
            })
          }
        shell: Rscript {0}

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Check package
        env:
          _R_CHECK_CRAN_INCOMING_: false
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran", "--no-build-vignettes"), 
            build_args = c("--no-build-vignettes"),
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: find check -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.config.artifact-name }}-results
          path: check

  # Extended testing with all optional dependencies
  extended-tests:
    name: Extended Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.run_extended_tests == 'true' || github.ref == 'refs/heads/main'
    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install all dependencies
        run: |
          remotes::install_deps(dependencies = TRUE)
          # Force install all Suggests packages
          suggests <- c("tmle", "MatchIt", "energy", "parallel", "rmarkdown", "covr", "testthat")
          install.packages(suggests)
        shell: Rscript {0}

      - name: Run extended test suite
        run: |
          # Run tests with extended coverage
          testthat::test_dir("tests/testthat", reporter = "progress")
          
          # Run power analysis tests
          cat("Running power analysis validation...\n")
          source("tests/testthat/test-power-analysis.R")
          
          # Test all estimators if available
          cat("Testing all estimators...\n")
          available_estimators <- c()
          if (requireNamespace("tmle", quietly = TRUE)) {
            available_estimators <- c(available_estimators, "tmle")
          }
          if (requireNamespace("MatchIt", quietly = TRUE)) {
            available_estimators <- c(available_estimators, "matching")
          }
          
          cat("Available estimators:", paste(available_estimators, collapse = ", "), "\n")
        shell: Rscript {0}

  # Performance benchmarking
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: |
          remotes::install_deps(dependencies = TRUE)
          install.packages(c("bench", "profvis"))
        shell: Rscript {0}

      - name: Run benchmarks
        run: |
          library(bench)
          library(unconfoundedr)
          
          # Benchmark different configurations
          set.seed(42)
          rct_data <- generate_rct_data(n = 500)
          obs_data <- generate_obs_data(n = 1000)
          
          # Benchmark different estimators
          benchmark_results <- bench::mark(
            aipw = unconfoundedness_test(rct_data, obs_data, Y ~ A + X1 + X2, 
                                       estimator = "aipw", B = 100, validate = FALSE),
            ipw = unconfoundedness_test(rct_data, obs_data, Y ~ A + X1 + X2, 
                                      estimator = "ipw", B = 100, validate = FALSE),
            check = FALSE,
            iterations = 3
          )
          
          print(benchmark_results)
          
          # Save results
          saveRDS(benchmark_results, "benchmark_results.rds")
        shell: Rscript {0}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: benchmark_results.rds

  # Code coverage
  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: |
          remotes::install_deps(dependencies = TRUE)
          remotes::install_cran("covr")
        shell: Rscript {0}

      - name: Test coverage
        run: |
          coverage <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
          covr::to_cobertura(coverage)
        shell: Rscript {0}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./cobertura.xml
          fail_ci_if_error: false

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

# Final status check
  check-status:
    name: Check Status
    if: always()
    needs: [check, test-coverage]
    runs-on: ubuntu-latest
    
    steps:
      - name: Check if all required jobs passed
        run: |
          if [[ "${{ needs.check.result }}" == "success" && "${{ needs.test-coverage.result }}" == "success" ]]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed"
            echo "Check results: ${{ needs.check.result }}"
            echo "Coverage results: ${{ needs.test-coverage.result }}"
            exit 1
          fi
