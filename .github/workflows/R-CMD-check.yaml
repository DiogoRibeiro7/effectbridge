name: R-CMD-check

on:
  push:
    branches: [main, develop, release/*]
    paths-ignore:
      - 'README.md'
      - 'NEWS.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'README.md'
      - 'NEWS.md'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '0 2 * * *'   # daily, 02:00 UTC
  workflow_dispatch:
    inputs:
      run_extended_tests:
        description: 'Run extended test suite (longer runtime)'
        required: false
        default: false
        type: boolean

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-style:
    name: Lint and Style Check
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::styler
            any::lintr
            any::devtools
          needs: lint

      - name: Check code style
        run: |
          out <- styler::style_pkg(dry = "on")
          if (any(out$changed)) {
            cat("Files with style issues:\n")
            print(out[out$changed, ])
            quit(status = 1)
          } else {
            cat("All files pass style check.\n")
          }
        shell: Rscript {0}

      - name: Lint code
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}

  check:
    name: R-CMD-check (${{ matrix.config.os }}, R-${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release',  artifact-name: 'macOS'}
          - {os: windows-latest, r: 'release',  artifact-name: 'Windows'}
          - {os: ubuntu-latest,  r: 'devel',    artifact-name: 'Linux-devel',   http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release',  artifact-name: 'Linux-release'}
          - {os: ubuntu-latest,  r: 'oldrel-1', artifact-name: 'Linux-oldrel'}
          - {os: ubuntu-latest,  r: '4.1.0',    artifact-name: 'Linux-minimal'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_: false
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Single resolver + cache + system requirements
      - name: Install deps (incl. rcmdcheck & sessioninfo)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::sessioninfo
          needs: check

      # If you really want manual apt, fix libtiff here (Noble=libtiff-dev)
      # - name: Install system dependencies (Linux)
      #   if: runner.os == 'Linux'
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libtiff-dev

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: R CMD check
        env:
          _R_CHECK_CRAN_INCOMING_: false
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran", "--no-build-vignettes"),
            build_args = c("--no-build-vignettes"),
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: find check -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.artifact-name }}-results
          path: check

  extended-tests:
    name: Extended Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.run_extended_tests == 'true' || github.ref == 'refs/heads/main'
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::testthat
            any::rmarkdown
            any::covr
            any::tmle
            any::MatchIt
            any::energy
          needs: test

      - name: Run extended test suite
        run: |
          pkgload::load_all(export_all = TRUE, quiet = TRUE)
          testthat::test_dir("tests/testthat", reporter = "progress")
          cat("Running power analysis validation...\n")
          if (file.exists("tests/testthat/test-power-analysis.R")) {
            source("tests/testthat/test-power-analysis.R")
          } else {
            cat("No test-power-analysis.R found, skipping.\n")
          }
          cat("Testing available estimators...\n")
          available <- c()
          if (requireNamespace("tmle", quietly = TRUE)) available <- c(available, "tmle")
          if (requireNamespace("MatchIt", quietly = TRUE)) available <- c(available, "matching")
          cat("Available estimators:", paste(available, collapse = ", "), "\n")
        shell: Rscript {0}

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::bench
            any::pkgload
          needs: compute

      - name: Run benchmarks
        run: |
          library(bench)
          pkgload::load_all(export_all = TRUE, quiet = TRUE)

          set.seed(42)
          rct_data <- generate_rct_data(n = 500)
          obs_data <- generate_obs_data(n = 1000)

          res <- bench::mark(
            aipw = unconfoundedness_test(rct_data, obs_data, Y ~ A + X1 + X2,
                                         estimator = "aipw", B = 100, validate = FALSE),
            ipw  = unconfoundedness_test(rct_data, obs_data, Y ~ A + X1 + X2,
                                         estimator = "ipw",  B = 100, validate = FALSE),
            iterations = 3,
            check = FALSE
          )
          print(res)
          saveRDS(res, "benchmark_results.rds")
        shell: Rscript {0}

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark_results.rds

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
          covr::to_cobertura(cov, file = "cobertura.xml")
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v6

      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  check-status:
    name: Check Status
    if: always()
    needs: [check, test-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Final status
        run: |
          if [[ "${{ needs.check.result }}" == "success" && "${{ needs.test-coverage.result }}" == "success" ]]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed"
            echo "Check results: ${{ needs.check.result }}"
            echo "Coverage results: ${{ needs.test-coverage.result }}"
            exit 1
          fi
