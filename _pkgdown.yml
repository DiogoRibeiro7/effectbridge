# _pkgdown.yml — unconfoundedr
# This URL must match the final location on your blog.
url: https://diogoribeiro7.github.io/packages/unconfoundedr/

template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: "#0054AD"
    navbar-light-brand-color: "#0054AD"
    navbar-light-brand-hover-color: "#0054AD"
    navbar-light-active-color: "#0054AD"
    navbar-light-hover-color: "#0054AD"
    navbar-light-color: "#0054AD"

development:
  mode: auto

authors:
  Diogo Ribeiro:
    href: "https://github.com/Diogoribeiro7"

navbar:
  structure:
    left: [reference, articles, news]
    right: [github, blog]
  components:
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
        - text: Getting Started
          href: articles/getting-started.html
    news:
      text: News
      href: news/index.html
    github:
      text: GitHub
      href: https://github.com/DiogoRibeiro7/unconfoundedr
    blog:
      text: "← Back to Blog"
      href: https://diogoribeiro7.github.io/

reference:
  - title: "Main Functions"
    contents:
      - unconfoundedness_test
      - print.unconf_test
      - summary.unconf_test
      - plot.unconf_test

  - title: "Diagnostics & utilities"
    contents:
      - matches("diagnostic|assess|balance|overlap|sensitivity|e_?value")
      - starts_with("compute_")
      - starts_with("estimate_")
      - starts_with("perform_")
      - starts_with("fit_")

  # Include but de-emphasize internals
  - title: "Internals"
    desc: "Non-API helpers"
    contents:
      - has_keyword("internal")

home:
  title: "unconfoundedr"
  description: >-
    Test (un)confoundedness by comparing an effect from an RCT-like dataset
    to the same estimand from an observational dataset. Supports IPW/AIPW,
    bootstrap CIs, a Wald test, and optional transportability weighting
    (manual or auto-detected via KS/energy tests).
  sidebar:
    structure: [links, license, community, citation, authors, dev, blog_link]
    components:
      citation:
        title: Citation
        text: If you use this package, please cite it (see inst/CITATION).
      community:
        title: Community
        text: >
          Questions or issues? Open one on
          [GitHub](https://github.com/DiogoRibeiro7/unconfoundedr/issues).
      blog_link:
        title: "Data Science Blog"
        text: >
          Visit my [blog](https://diogoribeiro7.github.io/) for more on statistics,
          machine learning, and R.

destination: docs

