# _pkgdown.yml — effectbridge
# This URL must match the final location on your blog.
url: https://diogoribeiro7.github.io/packages/effectbridge/

template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: "#0054AD"
    navbar-light-brand-color: "#0054AD"
    navbar-light-brand-hover-color: "#0054AD"
    navbar-light-active-color: "#0054AD"
    navbar-light-hover-color: "#0054AD"
    navbar-light-color: "#0054AD"

development:
  mode: auto

authors:
  Diogo Ribeiro:
    href: "https://github.com/Diogoribeiro7"

navbar:
  structure:
    left: [reference, articles, news]
    right: [github, blog]
  components:
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
        - text: Getting Started
          href: articles/getting-started.html
    news:
      text: News
      href: news/index.html
    github:
      text: GitHub
      href: https://github.com/DiogoRibeiro7/effectbridge
    blog:
      text: "← Back to Blog"
      href: https://diogoribeiro7.github.io/

reference:
  - title: "Core Testing"
    desc: "Primary functions for unconfoundedness testing"
    contents:
      - unconfoundedness_test
      - batch_analysis

  - title: "Data Generation"
    desc: "Simulate RCT and observational datasets"
    contents:
      - generate_rct_data
      - generate_obs_data

  - title: "Power & Sample Size"
    desc: "Power analysis and sample size calculations"
    contents:
      - simulate_power_analysis
      - compute_required_sample_size

  - title: "S3 Methods"
    desc: "Print, summary, and plot methods for results"
    contents:
      - print.unconf_test
      - summary.unconf_test
      - plot.unconf_test
      - print.batch_unconf_test

  - title: "Reporting & Export"
    desc: "Generate reports and export results"
    contents:
      - create_diagnostic_report
      - create_latex_table
      - export_to_csv

  - title: "Utilities"
    desc: "Helper functions for multiple comparisons and installation"
    contents:
      - adjust_p_values
      - validate_installation

home:
  title: "effectbridge"
  description: >-
    Test (un)confoundedness by comparing an effect from an RCT-like dataset
    to the same estimand from an observational dataset. Supports IPW/AIPW,
    bootstrap CIs, a Wald test, and optional transportability weighting
    (manual or auto-detected via KS/energy tests).
  sidebar:
    structure: [links, license, community, citation, authors, dev, blog_link]
    components:
      citation:
        title: Citation
        text: If you use this package, please cite it (see inst/CITATION).
      community:
        title: Community
        text: >
          Questions or issues? Open one on
          [GitHub](https://github.com/DiogoRibeiro7/effectbridge/issues).
      blog_link:
        title: "Data Science Blog"
        text: >
          Visit my [blog](https://diogoribeiro7.github.io/) for more on statistics,
          machine learning, and R.

destination: docs


